function setCalView(v){
  state.calView = v;
  if(v === 'month'){
    const d = parseKey(state.selDate);
    state.calMonth = {y:d.getFullYear(), m:d.getMonth()};
  }
  if(v === 'year') state.calYear = parseKey(state.selDate).getFullYear();
  renderView();
}
function goDay(date){
  state.selDate = date;
  state.calView = 'day';
  const d = parseKey(date);
  state.calMonth = {y:d.getFullYear(), m:d.getMonth()};
  state.calYear = d.getFullYear();
  renderView();
}
function addExtra(date, name, hours){
  name = (name||'').trim();
  if(!name){ toast('先写下这项任务的名字'); return; }
  const c = ensureDay(date);
  c.extras.push({
    id: uid(), name,
    hours: Math.max(0, Number(hours) || 0),
    pts: pointsForHours(hours),
    done: false, at: null,
    createdAt: new Date().toISOString()
  });
  saveDB();
  renderView();
  toast('已添加到这一天');
}
function togglePlanTask(date, taskId){
  const found = findTask(taskId);
  if(!found) return;
  const {plan, task} = found;
  const today = todayKey();
  if(date > today){ toast('还没到这一天，先好好期待'); return; }
  if(!rangeHas(taskRange(plan, task), date)) return;

  if(task.mode === 'period'){
    const comp = periodCompletion(plan, task);
    if(comp){
      if(db.checkins[comp.date] && db.checkins[comp.date].tasks[taskId]){
        delete db.checkins[comp.date].tasks[taskId];
        saveDB(); renderView(); toast('已取消这次打卡');
      }
      return;
    }
    const c = ensureDay(date);
    c.tasks[taskId] = { at: new Date().toISOString(), pts: pointsForHours(task.estHours) };
    saveDB(); renderView();
    const pts = pointsForHours(task.estHours);
    toast('已完成' + (task.reward ? ' · 奖励：' + task.reward : '') + (pts ? ' · +' + pts + ' 积分' : ''));
    return;
  }

  if(task.mode === 'weekly'){
    const c = ensureDay(date);
    const rec = c.tasks[taskId];
    if(rec){
      rec.count = Math.max(1, Number(rec.count) || 1) + 1;
      rec.at = new Date().toISOString();
    }else{
      c.tasks[taskId] = { at: new Date().toISOString(), pts: 0, count: 1 };
    }
    const todayCount = taskDayCount(date, taskId);
    saveDB(); renderView();
    const cycle = weeklyCycleAt(task, date);
    const target = weeklyTargetOf(task);
    const cnt = cycle ? weeklyCheckedCount(task, cycle.start, cycle.end) : 0;
    const settled = cycle ? weeklySettlementFor(task, cycle.start) : null;
    let msg = '今日第 ' + todayCount + ' 次 · 本周 ' + cnt + '/' + target;
    if(task.reward) msg += ' · 奖励：' + task.reward;
    if(settled && settled.success && Number(settled.pts)) msg += ' · 本周已达标 +' + Number(settled.pts) + ' 积分';
    else if(cnt >= target) msg += ' · 已达标，等待结算';
    toast(msg);
    return;
  }

  const c = ensureDay(date);
  if(c.tasks[taskId]){
    delete c.tasks[taskId];
    saveDB(); renderView();
    toast('已取消这一天的打卡');
    return;
  }
  c.tasks[taskId] = { at: new Date().toISOString(), pts: pointsForHours(task.estHours) };
  saveDB(); renderView();
  const pts = pointsForHours(task.estHours);
  const st = dayStatus(date);
  const completeText = (st.total > 1 && st.done === st.total) ? ' · 当日全部完成' : '';
  toast('已完成' + (task.reward ? ' · 奖励：' + task.reward : '') + (pts ? ' · +' + pts + ' 积分' : '') + completeText);
}
function undoWeekly(date, taskId){
  const c = db.checkins[date];
  const rec = c && c.tasks && c.tasks[taskId];
  if(!rec) return;
  const n = Math.max(1, Number(rec.count) || 1);
  if(n <= 1) delete c.tasks[taskId];
  else rec.count = n - 1;
  saveDB(); renderView();
  toast(n > 1 ? '已撤销一次 · 今日剩 ' + (n - 1) + ' 次' : '已撤销这一天的打卡');
}
function toggleExtra(date, extraId){
  const c = db.checkins[date];
  if(!c) return;
  const ex = c.extras.find(e => e.id === extraId);
  if(!ex) return;
  if(date > todayKey()){ toast('还没到这一天'); return; }
  ex.done = !ex.done;
  ex.at = ex.done ? new Date().toISOString() : null;
  saveDB(); renderView();
  if(ex.done) toast('已完成 · +' + (Number(ex.pts)||0) + ' 积分');
  else toast('已取消打卡');
}
function removeExtra(date, extraId){
  const c = db.checkins[date];
  if(!c) return;
  const ex = c.extras.find(e => e.id === extraId);
  if(!ex) return;
  const idx = c.extras.indexOf(ex);
  c.extras.splice(idx, 1);
  saveDB(); renderView();
  toast('已删除临时任务');
}
function removeDayTask(date, taskId){
  const found = findTask(taskId);
  if(!found) return;
  const c = ensureDay(date);
  if(!c.removed.includes(taskId)) c.removed.push(taskId);
  if(found.task.mode !== 'period' && c.tasks[taskId]) delete c.tasks[taskId];
  saveDB(); renderView();
  toast('已从当天日程移除，其他日期不受影响');
}
function handleExtraForm(form){
  const date = form.getAttribute('data-date');
  const name = $('#extraName').value;
  const hours = $('#extraHours').value;
  addExtra(date, name, hours);
}
function handleAction(act, el){
  const date = el.getAttribute('data-date');
  switch(act){
    case 'cal-view': setCalView(el.getAttribute('data-view')); break;
    case 'day-prev': goDay(addDays(state.selDate, -1)); break;
    case 'day-next': goDay(addDays(state.selDate, 1)); break;
    case 'day-today': goDay(todayKey()); break;
    case 'month-prev': {
      let {y, m} = state.calMonth; m--; if(m < 0){ m = 11; y--; }
      state.calMonth = {y, m}; renderView(); break;
    }
    case 'month-next': {
      let {y, m} = state.calMonth; m++; if(m > 11){ m = 0; y++; }
      state.calMonth = {y, m}; renderView(); break;
    }
    case 'month-today': {
      const d = new Date(); state.calMonth = {y:d.getFullYear(), m:d.getMonth()}; renderView(); break;
    }
    case 'year-prev': state.calYear--; renderView(); break;
    case 'year-next': state.calYear++; renderView(); break;
    case 'year-today': state.calYear = new Date().getFullYear(); renderView(); break;
    case 'goto-day': goDay(date); break;
    case 'goto-month': {
      state.calMonth = {y:Number(el.getAttribute('data-y')), m:Number(el.getAttribute('data-m'))};
      state.calView = 'month'; renderView(); break;
    }
    case 'toggle-task': togglePlanTask(date, el.getAttribute('data-task')); break;
    case 'undo-weekly': undoWeekly(date, el.getAttribute('data-task')); break;
    case 'remove-day-task': removeDayTask(date, el.getAttribute('data-task')); break;
    case 'toggle-extra': toggleExtra(date, el.getAttribute('data-extra')); break;
    case 'remove-extra': removeExtra(date, el.getAttribute('data-extra')); break;
  }
}

/* ============================================================
   规划
   ============================================================ */
function planStatusOf(plan){
  const today = todayKey();
  if(plan.archivedAt) return {key:'archived', label:'已归档'};
  if(today < plan.start) return {key:'future', label:'未开始'};
  if(today > planEndKey(plan)) return {key:'ended', label:'已结束'};
  return {key:'active', label:'进行中'};
}
function planCompletedDays(plan){
  const today = todayKey();
  const end = minKey(planEndKey(plan), today);
  let n = 0, d = plan.start;
  while(d <= end){
    const daily = plan.tasks.filter(t => t.mode === 'daily')
      .filter(t => rangeHas(taskRange(plan,t), d) && !isDayTaskRemoved(d, t.id));
    if(daily.length && daily.every(t => isTaskChecked(d, t.id))) n++;
    d = addDays(d, 1);
  }
  return n;
}
function taskMetrics(plan, task){
  const range = taskRange(plan, task);
  if(!range) return {days:0, rewards:0, penalties:0, points:0, state:'none'};
  if(task.mode === 'weekly'){
    const today = todayKey();
    const end = minKey(range[1], today);
    let days = 0, d = range[0];
    while(d <= end){
      if(!isDayTaskRemoved(d, task.id) && isTaskChecked(d, task.id)) days++;
      d = addDays(d, 1);
    }
    const settlements = weeklyTaskSettlements(plan.id, task.id);
    const rewards = settlements.filter(s => s.success).length;
    const penalties = settlements.filter(s => !s.success).length;
    const points = settlements.reduce((n, s) => n + (Number(s.pts) || 0), 0);
    return {days, rewards, penalties, points, state:'weekly', settlements};
  }
  if(task.mode === 'period'){
    const comp = periodCompletion(plan, task);
    if(comp) return {days:1, rewards:1, penalties:0, points:Number(comp.rec.pts)||0, state:'success', completion:comp};
    if(periodFailed(plan, task)) return {days:0, rewards:0, penalties:1, points:0, state:'fail'};
    return {days:0, rewards:0, penalties:0, points:0, state:'pending'};
  }
  const done = dailyDoneDays(plan, task);
  const missed = dailyMissedDays(plan, task);
  let points = 0, d = range[0];
  const today = todayKey();
  while(d <= range[1] && d <= today){
    const c = db.checkins[d];
    if(c && c.tasks && c.tasks[task.id] && !isDayTaskRemoved(d, task.id)){
      points += Number(c.tasks[task.id].pts) || 0;
    }
    d = addDays(d, 1);
  }
  return {days:done, rewards:done, penalties:missed, points, state:'daily'};
}
function planMetrics(plan){
  let rewards = 0, penalties = 0, points = 0;
  const rows = plan.tasks.map(task => {
    const m = taskMetrics(plan, task);
    rewards += m.rewards; penalties += m.penalties; points += m.points;
    return {task, m};
  });
  return {completedDays:planCompletedDays(plan), rewards, penalties, points, rows};
}
function renderPlansPage(){
  const active = db.plans.filter(p => !p.archivedAt);
  const archived = db.plans.filter(p => p.archivedAt);
  const head =
    '<div class="page-head"><div><h1>规划</h1><p class="sub">把长期目标拆成一个个可执行的日子</p></div>' +
      '<div class="page-actions"><button class="btn btn-primary" data-act="new-plan">' + icon('plus', 15) + '新建规划</button></div>' +
    '</div>';

    body = '<div class="card empty" style="padding:56px 22px">' +
      '<div class="empty-ic">' + icon('plan', 22) + '</div>' +

      '<button class="btn btn-primary mt-3" data-act="new-plan">' + icon('plus', 15) + '创建第一个规划</button>' +

      '<div class="plan-grid">' + archived.map(renderPlanCard).join('') + '</div></details>';
  }
  return head + body + archHtml;

function renderPlanCard(plan){
  const status = planStatusOf(plan);
  const met = planMetrics(plan);
  const today = todayKey();
  const allActive = plan.tasks.filter(t => !t.to);
  const dailyToday = plan.tasks.filter(t => t.mode === 'daily' && rangeHas(taskRange(plan,t), today) && !isDayTaskRemoved(today,t.id));
  const doneToday = dailyToday.filter(t => isTaskChecked(today, t.id)).length;
  let todayState = '今日 ' + doneToday + '/' + dailyToday.length;
  if(status.key === 'future') todayState = '尚未开始';
  else if(status.key === 'archived') todayState = '历史已保留';
  else if(status.key === 'ended') todayState = '已结束';
  else if(!dailyToday.length) todayState = '今日无每日任务';

  const chips = allActive.slice(0, 4).map(t =>
    '<span class="plan-chip' + (t.mode === 'period' ? ' period' : t.mode === 'weekly' ? ' weekly' : '') + '"><i></i><span>' + esc(t.name) + '</span></span>'
  ).join('');
  const more = allActive.length > 4 ? '<span class="plan-chip more">+' + (allActive.length - 4) + '</span>' : '';

  return '<article class="plan-card card" data-act="view-plan" data-plan="' + plan.id + '" tabindex="0" role="button" aria-label="查看规划 ' + esc(plan.name) + '">' +

      '<div><b>' + allActive.length + '</b><span>任务</span></div>' +
      '<div><b>' + doneToday + '<span style="font-size:11px;color:#aab6ab">/</span>' + dailyToday.length + '</b><span>今日完成</span></div>' +

    '<div class="plan-task-chips">' + (chips || '<span class="plan-chip more">暂无任务</span>') + more + '</div>' +

}

  if(plan && plan.archivedAt){ toast('已归档的规划不能编辑', 'terra'); return; }
  state.editingPlanId = plan ? plan.id : null;

    const tasks = plan.tasks.filter(t => !t.to).map(t => ({
      id: t.id, name: t.name, mode: t.mode, deadline: t.deadline,
      estHours: t.estHours, reward: t.reward, penalty: t.penalty,
      weeklyTarget: t.weeklyTarget || 3, banWeekStart: t.banWeekStart || 1, banWeekEnd: t.banWeekEnd || 3,

function refreshPlanEditorRows(){

function showPlanError(msg){
  const el = $('#planFormError');
  if(!el) { toast(msg, 'terra'); return; }
  el.textContent = msg;
  el.classList.add('show');
}
function savePlanDraft(){
  const d = state.planDraft;
  const name = (d.name || '').trim();
  const error = $('#planFormError');
  if(error) error.classList.remove('show');
  if(!name) return showPlanError('给这个规划起一个名字吧');
  if(!d.start || !d.end) return showPlanError('请选择规划的起止时间');
  if(d.start > d.end) return showPlanError('开始日期不能晚于结束日期');
  if(!d.tasks.length) return showPlanError('至少保留一项任务');
  for(let i=0; i<d.tasks.length; i++){
    const t = d.tasks[i];
    if(!(t.name || '').trim()) return showPlanError('第 ' + (i+1) + ' 项任务还没有名字');
    if(t.mode === 'weekly'){
      const wt = Number(t.weeklyTarget) || 3;
      if(wt < 1 || wt > 7) return showPlanError('第 ' + (i+1) + ' 项周期任务的每周次数需要在 1–7 之间');
      if(t.penaltyMode === 'ban'){
        if(!(t.penalty||'').trim()) return showPlanError('第 ' + (i+1) + ' 项任务选择了禁止做某事，请填写禁止的事项');
        const bs = Number(t.banWeekStart) || 1;
        const be = Number(t.banWeekEnd) || 3;
        if(bs > be) return showPlanError('第 ' + (i+1) + ' 项任务的禁止时间段开始星期不能晚于结束星期');
      }
    }
    if(t.mode === 'period'){
      if(!t.deadline) return showPlanError('第 ' + (i+1) + ' 项节点任务还没有截止时间');
      const dlKey = t.deadline.slice(0,10);
      if(dlKey < d.start || dlKey > d.end) return showPlanError('第 ' + (i+1) + ' 项任务的截止时间需要在规划时间段内');
      if(t.penaltyMode === 'ban'){
        if(!(t.penalty||'').trim()) return showPlanError('第 ' + (i+1) + ' 项任务选择了禁止做某事，请填写禁止的事项');
        if(!t.banStart || !t.banEnd) return showPlanError('第 ' + (i+1) + ' 项任务还没有选择禁止时间段');
        if(t.banStart > t.banEnd) return showPlanError('第 ' + (i+1) + ' 项任务的禁止时间开始日期不能晚于结束日期');
      }
    }
  }
  const today = todayKey();
  if(state.editingPlanId){
    const plan = findPlan(state.editingPlanId);
    if(!plan) return;
    plan.name = name;
    plan.start = d.start;
    plan.end = d.end;
    const oldById = new Map(plan.tasks.map(t => [t.id, t]));
    const draftIds = new Set(d.tasks.map(t => t.id));
    const finalTasks = [];
    d.tasks.forEach(t => {
      const nm = (t.name||'').trim();
      if(t.isNew){
        finalTasks.push({
          id: uid(), name: nm, mode: t.mode,
          deadline: t.mode === 'period' ? t.deadline : '',
          weeklyTarget: t.mode === 'weekly' ? clamp(Number(t.weeklyTarget)||3, 1, 7) : 0,
          banWeekStart: t.mode === 'weekly' && t.penaltyMode === 'ban' ? clamp(Number(t.banWeekStart)||1, 1, 7) : 0,
          banWeekEnd: t.mode === 'weekly' && t.penaltyMode === 'ban' ? Math.max(clamp(Number(t.banWeekStart)||1, 1, 7), clamp(Number(t.banWeekEnd)||3, 1, 7)) : 0,
          estHours: Math.max(0, Number(t.estHours) || 0),
          reward: (t.reward||'').trim(), penalty: (t.penalty||'').trim(),
          penaltyMode: (t.mode === 'period' || t.mode === 'weekly') && t.penaltyMode === 'ban' ? 'ban' : 'text',
          banStart: t.mode === 'period' && t.penaltyMode === 'ban' ? t.banStart : '',
          banEnd: t.mode === 'period' && t.penaltyMode === 'ban' ? t.banEnd : '',
          from: maxKey(today, d.start), to: null, createdAt: new Date().toISOString()
        });
      }else{
        const old = oldById.get(t.id);
        if(!old) return;
        let from = old.from || plan.start;
        if(d.originalStart !== null && old.from === d.originalStart && d.start !== d.originalStart) from = d.start;
        finalTasks.push(Object.assign({}, old, {
          name: nm, mode: t.mode,
          deadline: t.mode === 'period' ? t.deadline : '',
          weeklyTarget: t.mode === 'weekly' ? clamp(Number(t.weeklyTarget)||3, 1, 7) : 0,
          banWeekStart: t.mode === 'weekly' && t.penaltyMode === 'ban' ? clamp(Number(t.banWeekStart)||1, 1, 7) : 0,
          banWeekEnd: t.mode === 'weekly' && t.penaltyMode === 'ban' ? Math.max(clamp(Number(t.banWeekStart)||1, 1, 7), clamp(Number(t.banWeekEnd)||3, 1, 7)) : 0,
          estHours: Math.max(0, Number(t.estHours) || 0),
          reward: (t.reward||'').trim(), penalty: (t.penalty||'').trim(),
          penaltyMode: (t.mode === 'period' || t.mode === 'weekly') && t.penaltyMode === 'ban' ? 'ban' : 'text',
          banStart: t.mode === 'period' && t.penaltyMode === 'ban' ? t.banStart : '',
          banEnd: t.mode === 'period' && t.penaltyMode === 'ban' ? t.banEnd : '',
          from
        }));
      }
    });
    plan.tasks.forEach(t => {
      if(draftIds.has(t.id)) return;
      if(t.to){ finalTasks.push(t); return; }
      if(t.from > today) return;
      const newTo = addDays(today, -1);
      if(newTo < t.from) return;
      finalTasks.push(Object.assign({}, t, {to:newTo}));
      Object.keys(db.checkins).forEach(date => {
        if(date > newTo && db.checkins[date] && db.checkins[date].tasks){
          delete db.checkins[date].tasks[t.id];
        }
      });
    });
    plan.tasks = finalTasks;
    saveDB();
    closeModal();
    renderView();
    toast('规划已更新');
    openPlanDetail(plan.id);
  }else{
    const plan = {
      id: uid(), name, start: d.start, end: d.end,
      createdAt: new Date().toISOString(), archivedAt: null,
      tasks: d.tasks.map(t => ({
        id: uid(), name: (t.name||'').trim(), mode: t.mode,
        deadline: t.mode === 'period' ? t.deadline : '',
        weeklyTarget: t.mode === 'weekly' ? clamp(Number(t.weeklyTarget)||3, 1, 7) : 0,
        banWeekStart: t.mode === 'weekly' && t.penaltyMode === 'ban' ? clamp(Number(t.banWeekStart)||1, 1, 7) : 0,
        banWeekEnd: t.mode === 'weekly' && t.penaltyMode === 'ban' ? Math.max(clamp(Number(t.banWeekStart)||1, 1, 7), clamp(Number(t.banWeekEnd)||3, 1, 7)) : 0,
        estHours: Math.max(0, Number(t.estHours) || 0),
        reward: (t.reward||'').trim(), penalty: (t.penalty||'').trim(),
        penaltyMode: (t.mode === 'period' || t.mode === 'weekly') && t.penaltyMode === 'ban' ? 'ban' : 'text',
        banStart: t.mode === 'period' && t.penaltyMode === 'ban' ? t.banStart : '',
        banEnd: t.mode === 'period' && t.penaltyMode === 'ban' ? t.banEnd : '',
        from: d.start, to: null, createdAt: new Date().toISOString()
      }))
    };
    db.plans.push(plan);
    saveDB();
    closeModal();
    setTab('plans');
    toast('规划已创建，开始第一天的坚持吧');
  }
}

function reviewScopePlans(scope){
  if(scope !== 'all'){
    const p = findPlan(scope);
    if(!p){ state.reviewScope = 'all'; scope = 'all'; }
  }
  if(scope === 'all') return db.plans.slice().sort((a,b) => (b.start || '').localeCompare(a.start || ''));
  return [findPlan(scope)];
}
function reviewDistinctDays(plans){
  const set = new Set();
  const today = todayKey();
  plans.forEach(plan => {
    plan.tasks.forEach(task => {
      const range = taskRange(plan, task);
      if(!range) return;
      const end = minKey(range[1], today);
      let d = range[0];
      while(d <= end){
        const c = db.checkins[d];
        if(c && c.tasks && c.tasks[task.id] && !isDayTaskRemoved(d, task.id)) set.add(d);
        d = addDays(d, 1);
      }
    });
  });
  return set.size;
}
function buildReview(scope){
  const plans = reviewScopePlans(scope);
  const today = todayKey();
  let rewards = 0, penalties = 0, points = 0, taskCount = 0;
  const groups = [];
  plans.forEach(plan => {
    const rows = [];
    plan.tasks.forEach(task => {
      const m = taskMetrics(plan, task);
      if(m.state === 'none') return;
      rows.push({
        planId: plan.id, taskId: task.id,
        name: task.name, mode: task.mode, reward: task.reward || '',
        weeklyTarget: task.mode === 'weekly' ? weeklyTargetOf(task) : 0,
        penalty: penaltyLabel(task), deadline: task.deadline || '',
        days: m.days, rewards: m.rewards, penalties: m.penalties,
        points: m.points, state: m.state
      });
      rewards += m.rewards;
      penalties += m.penalties;
      points += m.points;
      taskCount++;
    });
    if(rows.length){
      groups.push({
        planId: plan.id, name: plan.name, start: plan.start, end: plan.end,
        archived: !!plan.archivedAt, status: planStatusOf(plan).label, rows
      });
    }
  });
  const journals = [];
  Object.keys(db.checkins).sort().reverse().forEach(date => {
    if(date > today) return;
    const text = (db.checkins[date].journal || '').trim();
    if(!text) return;
    if(scope !== 'all'){
      const plan = plans[0];
      const end = minKey(planEndKey(plan), today);
      if(date < plan.start || date > end) return;
    }
    journals.push({date, text});
  });
  let scopeLabel = '全部时间';
  let rangeLabel = '暂无规划记录';
  if(scope !== 'all'){
    const plan = plans[0];
    scopeLabel = plan.name;
    rangeLabel = plan.start + ' – ' + (plan.archivedAt ? '归档于 ' + plan.archivedAt : plan.end);
  }else if(plans.length){
    const starts = plans.map(p => p.start).sort();
    const ends = plans.map(p => planEndKey(p)).sort();
    rangeLabel = starts[0] + ' – ' + ends[ends.length - 1];
  }
  return {
    scope, scopeLabel, rangeLabel,
    groups, journals, planCount: groups.length, taskCount,
    summary: { days: reviewDistinctDays(plans), rewards, penalties, points }
  };
}

function metricEvents(plan, task, kind){
  const range = taskRange(plan, task);
  if(!range) return [];
  const out = [];
  if(task.mode === 'weekly'){
    const settlements = weeklyTaskSettlements(plan.id, task.id);
    settlements.forEach(s => {
      if(kind === 'reward' && s.success){
        out.push({date: s.checkDate, note: '结算 ' + fmtMD(s.cycleEnd) + ' 那周 · ' + s.checked + '/' + s.target + ' 次达标' + (Number(s.pts) ? ' · +' + s.pts + ' 积分' : '')});
      }
      if(kind === 'penalty' && !s.success){
        out.push({date: s.checkDate, note: '结算 ' + fmtMD(s.cycleEnd) + ' 那周 · 仅 ' + s.checked + '/' + s.target + ' 次' + (s.banFrom ? ' · 禁止期 ' + fmtMD(s.banFrom) + ' – ' + fmtMD(s.banTo) : '')});
      }
    });
    return out;
  }
  if(task.mode === 'period'){
    if(kind === 'reward'){
      const comp = periodCompletion(plan, task);
      if(comp) out.push({date: comp.date, note:'截止前完成'});
    }else if(periodFailed(plan, task)){
      const note = task.penaltyMode === 'ban' && task.banStart && task.banEnd
        ? '已错过截止 · 禁止期 ' + fmtMD(task.banStart) + ' – ' + fmtMD(task.banEnd)
        : '已错过截止';
      out.push({date: task.deadline.slice(0,10), note});
    }
    return out;
  }
  const today = todayKey();
  const end = kind === 'reward' ? minKey(range[1], today) : minKey(range[1], addDays(today, -1));
  let d = range[0];
  while(d <= end){
    if(!isDayTaskRemoved(d, task.id)){
      const checked = isTaskChecked(d, task.id);
      if(kind === 'reward' && checked) out.push({date: d, note:'已完成'});
      if(kind === 'penalty' && !checked) out.push({date: d, note:'未完成'});
    }
    d = addDays(d, 1);
  }
  return out;
}

  const isReward = kind === 'reward';

    g.rows.forEach(row => {
      lines.push('· ' + row.name + '（' + taskModeShort(row.mode) + '）：坚持 ' + row.days + ' 天，奖励 ' + row.rewards + ' 次，惩罚 ' + row.penalties + ' 次');

    });
  });
  lines.push('');
  lines.push('—— 每日总结 ——');
  if(s.journals.length){
    s.journals.forEach(j => {
      lines.push('');
      lines.push(j.date);
      lines.push(j.text);
    });
  }else{
    lines.push('这段时间还没有写下总结。');
  }
  const text = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '自律人格回顾_' + s.createdAt.slice(0,10) + '.txt';

    const can = bal >= cost;
    return '<div class="wish-card card">' +
      '<div class="wish-top"><div><div class="wish-name">' + esc(w.name) + '</div>' + (w.note ? '<div class="wish-note">' + esc(w.note) + '</div>' : '') + '</div>' +
        '<div class="wish-acts">' +
          '<button class="wish-edit" data-act="edit-wish" data-wish="' + w.id + '" title="编辑愿望" aria-label="编辑愿望">' + icon('edit', 13) + '</button>' +
          '<button class="wish-del" data-act="delete-wish" data-wish="' + w.id + '" title="删除愿望" aria-label="删除愿望">' + icon('x', 14) + '</button>' +
        '</div></div>' +
      '<div class="wish-bottom"><div>' +
        '<div class="wish-cost">' + cost + '<small>积分</small></div>' +
        '<div class="wish-progress"><i style="width:' + pct + '%"></i></div>' +
        '<div class="wish-status">' + (can ? '积分已足够' : '还差 ' + (cost - bal) + ' 积分') + '</div>' +
      '</div>' +
      (can
        ? '<button class="btn btn-primary btn-sm" data-act="redeem-wish" data-wish="' + w.id + '">兑换</button>'
        : '<button class="btn btn-ghost btn-sm" disabled>积分不足</button>') +
      '</div>' +
    '</div>';
  }).join('') : '<div class="card empty" style="padding:34px 22px;grid-column:1/-1"><div class="empty-ic">' + icon('store', 22) + '</div><b>愿望清单还是空的</b><p>把想犒劳自己的事写下来，积分够了就来兑换。</p><button class="btn btn-primary mt-3" data-act="add-wish">' + icon('plus', 15) + '添加愿望</button></div>';

  const redeemedHtml = redeemed.length ? '<div class="wish-head" style="margin-top:26px"><div><h2>已兑换</h2><div class="wh-sub">用坚持换来的小奖励</div></div></div>' +
    '<div class="card panel" style="padding:10px 18px"><div class="redeemed-list">' + redeemed.map(w =>
      '<div class="redeemed-row"><span class="rr-name">' + esc(w.name) + '</span><span class="rr-cost">-' + w.cost + '</span><span class="rr-date">' + fmtStamp(w.redeemedAt) + '</span></div>'
    ).join('') + '</div></div>' : '';

  return '<div class="page-head"><div><h1>商城</h1><p class="sub">让坚持有一点看得见的回报</p></div>' +
      '<div class="page-actions"><button class="btn btn-primary" data-act="add-wish">' + icon('plus', 15) + '添加愿望</button></div>' +
    '</div>' +
    '<div class="wallet">' +
      '<div><div class="wallet-label">可用积分</div><div class="wallet-value"><b>' + bal + '</b><span>积分</span></div>' +
        '<div class="wallet-note">完成任务按时长获得积分 · 每小时 10 积分<br>累计获得 ' + earned + ' · 已使用 ' + spent + '</div></div>' +
      '<div class="wallet-mark">' + icon('spark', 26) + '</div>' +
    '</div>' +
    '<div class="wish-head"><div><h2>愿望清单</h2><div class="wh-sub">积分达标后即可兑换</div></div></div>' +
    '<div class="wish-grid">' + wishCards + '</div>' +
    redeemedHtml;
}
function openWishEditor(wishId){
  const wish = wishId ? db.wishes.find(w => w.id === wishId) : null;
  const editing = !!wish;
  state.editingWishId = editing ? wish.id : null;
  openModal(
    '<div class="modal-head"><div><h3>' + (editing ? '编辑愿望' : '添加一个愿望') + '</h3><p>' + (editing ? '调整名称、积分或备注' : '给坚持留一点期待') + '</p></div><button class="modal-close" data-act="modal-close" aria-label="关闭">' + icon('x', 16) + '</button></div>' +
    '<div class="modal-body">' +
      '<div class="form-grid">' +
        '<div class="field full"><label>愿望</label><input class="input" id="wishName" maxlength="40" value="' + esc(editing ? wish.name : '') + '" placeholder="例如：周末去看一场电影" autocomplete="off"></div>' +
        '<div class="field full"><label>需要积分</label><input class="input" id="wishCost" type="number" min="1" step="10" value="' + (editing ? (Number(wish.cost) || '') : '') + '" placeholder="例如：60" inputmode="numeric"></div>' +
        '<div class="field full"><label>备注（可选）</label><input class="input" id="wishNote" maxlength="80" value="' + esc(editing ? (wish.note || '') : '') + '" placeholder="想对它说的一句话" autocomplete="off"></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot"><div class="mf-note">积分来自每日、周期与节点任务的完成</div><div class="mf-actions"><button class="btn btn-ghost" data-act="modal-close">取消</button><button class="btn btn-primary" data-act="wish-save">' + (editing ? '保存修改' : '添加愿望') + '</button></div></div>'
  );
}
function saveWish(){
  const name = ($('#wishName') && $('#wishName').value || '').trim();
  const cost = parseInt(($('#wishCost') && $('#wishCost').value) || '0', 10);
  const note = ($('#wishNote') && $('#wishNote').value || '').trim();
  if(!name){ toast('先写下这个愿望是什么'); return; }
  if(!cost || cost <= 0){ toast('给这个愿望设置一个积分价格'); return; }
  const editingId = state.editingWishId;
  const wish = editingId ? db.wishes.find(w => w.id === editingId) : null;
  state.editingWishId = null;
  if(wish){
    wish.name = name;
    wish.cost = cost;
    wish.note = note;
    wish.updatedAt = new Date().toISOString();
    saveDB();
    closeModal();
    renderView();
    toast('愿望已更新');
    return;
  }
  db.wishes.push({
    id: uid(), name, cost, note,
    createdAt: new Date().toISOString(), redeemedAt: null
  });
  saveDB();
  closeModal();
  renderView();
  toast('愿望已加入清单');
}
function redeemWish(wishId){
  const wish = db.wishes.find(w => w.id === wishId);
  if(!wish || wish.redeemedAt) return;
  const bal = balancePoints();
  if(bal < wish.cost){ toast('积分还不够，再坚持几天吧', 'terra'); return; }
  openConfirm({
    title: '兑换「' + wish.name + '」',
    text: '将消耗 ' + wish.cost + ' 积分，兑换后余额为 ' + (bal - wish.cost) + ' 积分。',
    confirmText: '确认兑换',
    onConfirm(){
      const cur = balancePoints();
      if(cur < wish.cost){ toast('积分不足，暂时无法兑换', 'terra'); return; }
      const at = new Date().toISOString();
      wish.redeemedAt = at;
      db.redemptions.push({ id: uid(), wishId: wish.id, name: wish.name, cost: wish.cost, at });
      saveDB();
      renderView();
      toast('已兑换：' + wish.name);
    }
  });
}
function deleteWish(wishId){
  const wish = db.wishes.find(w => w.id === wishId);
  if(!wish) return;
  openConfirm({
    title: '删除这个愿望？',
    text: '「' + wish.name + '」会从愿望清单中移除。',
    confirmText: '删除',
    danger: true,
    onConfirm(){
      db.wishes = db.wishes.filter(w => w.id !== wishId);
      saveDB();
      renderView();
      toast('已删除愿望');
    }
  });
}

/* ============================================================
   全局事件与启动
   ============================================================ */
const CAL_ACTS = new Set([
  'cal-view','day-prev','day-next','day-today','month-prev','month-next','month-today',
  'year-prev','year-next','year-today','goto-day','goto-month','toggle-task',
  'undo-weekly','remove-day-task','toggle-extra','remove-extra'
]);
function handleGlobalAction(el){
  const act = el.getAttribute('data-act');
  if(!act) return;
  if(CAL_ACTS.has(act)){ handleAction(act, el); return; }
  switch(act){
    case 'new-plan': openPlanEditor(null); break;
    case 'view-plan': openPlanDetail(el.getAttribute('data-plan')); break;
    case 'edit-plan': openPlanEditor(el.getAttribute('data-plan')); break;
    case 'archive-plan': archivePlan(el.getAttribute('data-plan')); break;
    case 'plan-review': {
      const id = el.getAttribute('data-plan');
      closeModal();
      state.reviewScope = id;
      setTab('review');
      break;
    }
    case 'modal-close': closeModal(); break;
    case 'confirm-close': closeConfirm(); break;
    case 'confirm-ok': {
      const cb = confirmCallback;
      closeConfirm();
      if(cb) cb();
      break;
    }
    case 'pe-mode': {
      const d = state.planDraft;
      if(!d) break;
      const idx = Number(el.getAttribute('data-idx'));
      const task = d.tasks[idx];
      if(!task) break;
      task.mode = el.getAttribute('data-mode');
      if(task.mode === 'period' && !task.deadline) task.deadline = d.end + 'T18:00';
      if(task.mode === 'weekly'){
        if(!task.weeklyTarget) task.weeklyTarget = 3;
        if(!task.banWeekStart) task.banWeekStart = 1;
        if(!task.banWeekEnd) task.banWeekEnd = 3;
      }
      refreshPlanEditorRows();
      break;
    }
    case 'pe-penalty-mode': {
      const d = state.planDraft;
      const idx = Number(el.getAttribute('data-idx'));
      const task = d.tasks[idx];
      if(!task) break;
      task.penaltyMode = el.getAttribute('data-mode') === 'ban' ? 'ban' : 'text';
      if(task.penaltyMode === 'ban' && task.mode === 'period'){
        const base = task.deadline ? task.deadline.slice(0,10) : d.end;
        if(!task.banStart) task.banStart = base;
        if(!task.banEnd) task.banEnd = addDays(task.banStart, 2);
      }
      refreshPlanEditorRows();
      break;
    }
    case 'pe-add-task': {
      const d = state.planDraft;
      if(!d) break;
      d.tasks.push(blankTask());
      refreshPlanEditorRows();
      const rows = $$('#planEditorRows .task-editor');
      const last = rows[rows.length - 1];
      if(last){
        last.scrollIntoView({block:'nearest', behavior:'smooth'});
        const inp = last.querySelector('input');
        if(inp) inp.focus();
      }
      break;
    }
    case 'pe-remove-task': {
      const d = state.planDraft;
      if(!d) break;
      d.tasks.splice(Number(el.getAttribute('data-idx')), 1);
      refreshPlanEditorRows();
      break;
    }
    case 'pe-save': savePlanDraft(); break;
    case 'review-scope': state.reviewScope = el.getAttribute('data-scope'); renderView(); break;
    case 'save-review': saveCurrentReview(); break;
    case 'review-metric':
      openReviewMetric(el.getAttribute('data-plan'), el.getAttribute('data-task'), el.getAttribute('data-kind'));
      break;
    case 'view-saved': openSavedReview(el.getAttribute('data-saved')); break;
    case 'download-saved': downloadSavedReview(el.getAttribute('data-saved')); break;
    case 'delete-saved': {
      const id = el.getAttribute('data-saved');
      const saved = db.savedReviews.find(s => s.id === id);
      if(!saved) break;
      openConfirm({
        title: '删除这份回顾？',
        text: '删除后无法恢复，但不会影响打卡记录与积分。',
        confirmText: '删除',
        danger: true,
        onConfirm(){
          db.savedReviews = db.savedReviews.filter(s => s.id !== id);
          saveDB();
          closeModal();
          renderView();
          toast('已删除保存的回顾');
        }
      });
      break;
    }
    case 'add-wish': openWishEditor(); break;
    case 'edit-wish': openWishEditor(el.getAttribute('data-wish')); break;
    case 'wish-save': saveWish(); break;
    case 'redeem-wish': redeemWish(el.getAttribute('data-wish')); break;
    case 'delete-wish': deleteWish(el.getAttribute('data-wish')); break;
  }
}

function bindEvents(){
  document.addEventListener('click', e => {
    const overlay = e.target.closest('.overlay[data-overlay]');
    if(overlay && e.target === overlay){
      if(overlay.getAttribute('data-overlay') === 'confirm') closeConfirm();
      else closeModal();
      return;
    }
    const tabEl = e.target.closest('[data-tab]');
    if(tabEl){
      const tab = tabEl.getAttribute('data-tab');
      if(tab){ setTab(tab); }
      return;
    }
    const actEl = e.target.closest('[data-act]');
    if(actEl){
      if(actEl.hasAttribute('disabled')) return;
      e.preventDefault();
      handleGlobalAction(actEl);
    }
  });
  document.addEventListener('submit', e => {
    const form = e.target;
    if(form && form.getAttribute('data-form') === 'extra'){
      e.preventDefault();
      handleExtraForm(form);
    }
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if(confirmRoot.innerHTML){ closeConfirm(); return; }
      if(modalRoot.innerHTML){ closeModal(); return; }
    }
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('plan-card')){
      e.preventDefault();
      openPlanDetail(e.target.getAttribute('data-plan'));
    }
  });
  const handleModalField = e => {
    if(!state.planDraft) return;
    const t = e.target;
    if(!modalRoot.contains(t)) return;
    if(t.hasAttribute('data-planfield')){
      state.planDraft[t.getAttribute('data-planfield')] = t.value;
      return;
    }
    if(t.hasAttribute('data-ptask') && t.hasAttribute('data-pfield')){
      const idx = Number(t.getAttribute('data-ptask'));
      const field = t.getAttribute('data-pfield');
      const task = state.planDraft.tasks[idx];
      if(!task) return;
      task[field] = t.value;
      if(field === 'estHours'){
        const p = document.getElementById('tePts' + idx);
        if(p) p.textContent = (task.mode === 'weekly' ? '达标 +' : '+') + pointsForHours(t.value) + ' 积分';
      }
    }
  };
  modalRoot.addEventListener('input', handleModalField);
  modalRoot.addEventListener('change', handleModalField);
}

/* ---------------- 启动 ---------------- */
db = loadDB();
saveDB();
renderShell();
renderView();
bindEvents();
})();
</script>
